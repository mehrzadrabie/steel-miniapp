<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>کاتالوگ و ثبت سفارش فولاد</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --text: var(--tg-theme-text-color, #f8fafc);
      --card: var(--tg-theme-secondary-bg-color, #1e293b);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --button: var(--tg-theme-button-color, #38bdf8);
      --button-text: var(--tg-theme-button-text-color, #0f172a);
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 0.85rem; color: var(--hint); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:active { transform: scale(0.98); }
    .card.selected { border-color: var(--button); background: rgba(56, 189, 248, 0.08); }
    .card-info { display: flex; align-items: center; gap: 12px; }
    .icon { font-size: 1.8rem; background: rgba(255,255,255,0.05); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
    .card-sub { font-size: 0.75rem; color: var(--hint); }
    .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: rgba(245, 158, 11, 0.15); color: var(--accent); font-weight: 600; }
    .btn-submit {
      width: 100%;
      background: var(--button);
      color: var(--button-text);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <h1>سامانه سفارش مقاطع فولادی</h1>
    <p>لطفاً محصول مورد نظر خود را جهت استعلام انتخاب کنید</p>
  </div>

  <div class="grid">
    <div class="card" onclick="selectItem('شمش فولادی (Billet)', this)">
      <div class="card-info">
        <div class="icon">🧱</div>
        <div>
          <div class="card-title">شمش فولادی</div>
          <div class="card-sub">Billet - گرید 3SP / 5SP</div>
        </div>
      </div>
      <span class="tag">سفارش عمده</span>
    </div>

    <div class="card" onclick="selectItem('کلاف صنعتی و ساختمانی', this)">
      <div class="card-info">
        <div class="icon">⚙️</div>
        <div>
          <div class="card-title">کلاف فولادی</div>
          <div class="card-sub">Wire Rod - ساده و آجدار</div>
        </div>
      </div>
      <span class="tag">تحویل سریع</span>
    </div>

    <div class="card" onclick="selectItem('میلگرد شاخه', this)">
      <div class="card-info">
        <div class="icon">🏗️</div>
        <div>
          <div class="card-title">انواع میلگرد</div>
          <div class="card-sub">Rebar - A2, A3, A4 (سایز ۸ تا ۳۲)</div>
        </div>
      </div>
      <span class="tag">قیمت روز</span>
    </div>
  </div>

  <button class="btn-submit" id="submitBtn" disabled onclick="sendData()">تأیید و ارسال انتخاب</button>

  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }
    let chosen = null;

    function selectItem(name, el) {
      chosen = name;
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.innerText = 'انتخاب: ' + name;
    }

    function sendData() {
      if (!chosen) return;
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ product: chosen }));
      } else {
        alert('انتخاب شما: ' + chosen + '
(در تلگرام ارسال خواهد شد)');
      }
    }
  </script>
</body>
</html>
